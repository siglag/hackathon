[project]
name = "medassist"
version = "0.1.0"
description = "Local Medical Assistant: local records, OCR, artifacts and gated PubMed evidence"
requires-python = ">=3.11,<3.14"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "httpx>=0.27",
  "pydantic>=2.7",
  "python-multipart>=0.0.9",
  "pandas>=2.2",
  "openpyxl>=3.1",
  "pypdf>=4.2",
  "pypdfium2>=4.30",
  "python-docx>=1.1",
  "fpdf2>=2.7",
  "pillow>=10.3",
  "opencv-python-headless>=4.9",
]

[project.optional-dependencies]
ocr = ["paddlepaddle>=3.0", "paddleocr>=3.0"]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["data/*.json"]
